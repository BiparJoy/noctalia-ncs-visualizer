name: Nix

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - renderer/**
      - .github/workflows/nix.yml
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - renderer/**
      - .github/workflows/nix.yml

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build all packages
        run: nix build .#aurora-ncs --print-build-logs --no-link

      - name: Smoke test
        run: |
          out=$(nix build .#aurora-ncs --no-link --print-out-paths)
          test -x "$out/bin/aurora-ncs"
          # aurora-ncs forces QT_QPA_PLATFORM=wayland, so even --version needs a
          # compositor. Check the real binary links fully and the wrapper adds cava.
          real="$out/bin/.aurora-ncs-wrapped"
          test -x "$real"
          if ldd "$real" | grep 'not found'; then
            echo "unresolved shared libraries" >&2
            exit 1
          fi
          grep -q cava "$out/bin/aurora-ncs"
